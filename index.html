<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine 💘</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a0011 0%, #2d0a1e 30%, #1a0022 60%, #0d0011 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Ambient floating hearts in background — desktop only */
    .ambient-heart {
      position: fixed;
      bottom: -40px;
      color: rgba(255, 50, 100, 0.06);
      font-size: 30px;
      pointer-events: none;
      z-index: 0;
      will-change: transform, opacity;
    }

    /* Main card */
    .card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 80, 120, 0.15);
      border-radius: 24px;
      padding: 50px 40px;
      text-align: center;
      max-width: 480px;
      width: 90%;
      position: relative;
      z-index: 10;
      box-shadow:
        0 0 60px rgba(255, 50, 100, 0.08),
        0 20px 60px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      animation: cardAppear 1s ease-out;
      transition: transform 0.5s ease, opacity 0.5s ease;
    }

    @keyframes cardAppear {
      0% {
        opacity: 0;
        transform: scale(0.8) translateY(30px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .card.hidden {
      transform: scale(0.8) translateY(-30px);
      opacity: 0;
      pointer-events: none;
    }

    .emoji-top {
      font-size: 64px;
      margin-bottom: 20px;
      animation: pulse 2s ease-in-out infinite;
      display: inline-block;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .question {
      font-size: 26px;
      color: #fff;
      margin-bottom: 36px;
      line-height: 1.4;
      font-weight: 600;
      text-shadow: 0 2px 10px rgba(255, 50, 100, 0.2);
    }

    .question .name {
      color: #ff6b95;
      font-weight: 700;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }

    .btn {
      padding: 16px 40px;
      font-size: 18px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 0.3px;
      transition: all 0.3s ease;
      width: 100%;
      max-width: 320px;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transition: left 0.5s ease;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff4d7d, #ff2d5e, #e8194e);
      color: white;
      box-shadow:
        0 4px 20px rgba(255, 45, 94, 0.4),
        0 0 40px rgba(255, 45, 94, 0.1);
    }

    .btn-primary:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow:
        0 8px 30px rgba(255, 45, 94, 0.5),
        0 0 60px rgba(255, 45, 94, 0.2);
    }

    .btn-primary:active {
      transform: translateY(0) scale(0.98);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: #ffb3c6;
      border: 1px solid rgba(255, 107, 149, 0.25);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .btn-secondary:hover {
      background: rgba(255, 107, 149, 0.12);
      border-color: rgba(255, 107, 149, 0.4);
      transform: translateY(-3px) scale(1.02);
      color: #ffd0dc;
      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.3),
        0 0 30px rgba(255, 80, 120, 0.1);
    }

    .btn-secondary:active {
      transform: translateY(0) scale(0.98);
    }

    /* Falling hearts container */
    #hearts-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    .falling-heart {
      position: absolute;
      top: -60px;
      pointer-events: none;
      filter: drop-shadow(0 0 6px rgba(255, 50, 100, 0.4));
      will-change: transform, opacity;
    }

    /* Result message */
    .result {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    .result.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .result-emoji {
      font-size: 80px;
      animation: bounceIn 0.6s ease-out 0.3s both, pulse 2s ease-in-out 0.9s infinite;
    }

    .result-text {
      font-size: 32px;
      color: #fff;
      margin-top: 20px;
      font-weight: 700;
      text-shadow: 0 2px 20px rgba(255, 50, 100, 0.4);
      animation: bounceIn 0.6s ease-out 0.5s both;
      text-align: center;
      padding: 0 20px;
      line-height: 1.4;
    }

    .result-sub {
      font-size: 18px;
      color: #ffb3c6;
      margin-top: 12px;
      animation: bounceIn 0.6s ease-out 0.7s both;
      text-align: center;
      padding: 0 20px;
    }

    @keyframes bounceIn {
      0% {
        opacity: 0;
        transform: scale(0.3) translateY(20px);
      }
      50% {
        transform: scale(1.08) translateY(-5px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* Sparkle burst behind result */
    .sparkle {
      position: fixed;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 15;
      animation: sparkleFade 1.5s ease-out forwards;
    }

    @keyframes sparkleFade {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(0);
      }
    }

    @media (max-width: 500px) {
      .card {
        padding: 40px 24px;
      }
      .question {
        font-size: 22px;
      }
      .btn {
        font-size: 16px;
        padding: 14px 30px;
      }
      .result-text {
        font-size: 26px;
      }
      .emoji-top {
        font-size: 52px;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient background hearts -->
  <div id="hearts-container"></div>

  <!-- Main card -->
  <div class="card" id="card">
    <div class="emoji-top">💘</div>
    <div class="question">
      <span class="name">Настя</span>, будеш моєю валентинкою?
    </div>
    <div class="buttons">
      <button class="btn btn-primary" onclick="handleAnswer('yes')">Так ❤️</button>
      <button class="btn btn-secondary" onclick="handleAnswer('shy')">Так, але соромлюсь 😄</button>
    </div>
  </div>

  <!-- Result screen -->
  <div class="result" id="result">
    <div class="result-emoji" id="result-emoji"></div>
    <div class="result-text" id="result-text"></div>
    <div class="result-sub" id="result-sub"></div>
  </div>

  <script>
    // Detect mobile for reduced heart count and performance
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || window.innerWidth < 600;

    // Create ambient background hearts — desktop only, JS-driven animation
    function createAmbientHearts() {
      if (isMobile) return; // skip on mobile — they cause visual glitches
      const hearts = ['♥', '♡', '❤'];
      const screenH = window.innerHeight;
      for (let i = 0; i < 10; i++) {
        const heart = document.createElement('div');
        heart.className = 'ambient-heart';
        heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        heart.style.left = Math.random() * 100 + '%';
        heart.style.fontSize = (20 + Math.random() * 25) + 'px';
        document.body.appendChild(heart);

        const duration = (14 + Math.random() * 16) * 1000;
        const delay = Math.random() * 1000; // start within 4s, not 15s

        function runFloat() {
          const anim = heart.animate([
            { transform: `translateY(0) rotate(0deg)`, opacity: 0 },
            { opacity: 0.8, offset: 0.1 },
            { opacity: 0.8, offset: 0.9 },
            { transform: `translateY(-${screenH + 80}px) rotate(360deg)`, opacity: 0 }
          ], {
            duration: duration,
            easing: 'linear'
          });
          anim.onfinish = runFloat;
        }

        setTimeout(runFloat, delay);
      }
    }
    createAmbientHearts();

    // Falling hearts animation using Web Animations API with real pixel values
    function spawnFallingHearts(count) {
      const container = document.getElementById('hearts-container');
      const emojis = ['❤️', '💕', '💖', '💗', '💓', '💘', '💝', '🌹', '✨', '💞'];
      // Use actual visible height — fixes iOS Safari vh bug
      const fallDistance = window.innerHeight + 120;
      const adjustedCount = isMobile ? Math.floor(count * 0.5) : count;

      for (let i = 0; i < adjustedCount; i++) {
        setTimeout(() => {
          const heart = document.createElement('div');
          heart.className = 'falling-heart';
          heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
          heart.style.left = Math.random() * 100 + '%';
          heart.style.fontSize = (isMobile ? 18 : 20) + Math.random() * (isMobile ? 22 : 35) + 'px';
          container.appendChild(heart);

          const duration = 2.5 + Math.random() * 3;
          const sway = (Math.random() - 0.5) * 80;

          heart.animate([
            { transform: 'translateY(0) translateX(0) rotate(0deg) scale(1)', opacity: 1 },
            { opacity: 1, offset: 0.7 },
            { transform: `translateY(${fallDistance}px) translateX(${sway}px) rotate(720deg) scale(0.5)`, opacity: 0 }
          ], {
            duration: duration * 1000,
            easing: 'linear',
            fill: 'forwards'
          });

          setTimeout(() => heart.remove(), duration * 1000 + 100);
        }, i * (isMobile ? 80 : 60));
      }
    }

    // Sparkle burst effect
    function createSparkles(x, y, count) {
      const colors = ['#ff4d7d', '#ff85a2', '#ffb3c6', '#fff', '#ffd700', '#ff69b4'];
      for (let i = 0; i < count; i++) {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        const angle = (Math.PI * 2 * i) / count;
        const distance = 80 + Math.random() * 120;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance;
        sparkle.style.setProperty('--tx', tx + 'px');
        sparkle.style.setProperty('--ty', ty + 'px');
        sparkle.style.left = x + 'px';
        sparkle.style.top = y + 'px';
        sparkle.style.background = colors[Math.floor(Math.random() * colors.length)];
        sparkle.style.width = (4 + Math.random() * 6) + 'px';
        sparkle.style.height = sparkle.style.width;
        document.body.appendChild(sparkle);
        setTimeout(() => sparkle.remove(), 1500);
      }
    }

    // Handle button click
    function handleAnswer(type) {
      const card = document.getElementById('card');
      const result = document.getElementById('result');
      const resultEmoji = document.getElementById('result-emoji');
      const resultText = document.getElementById('result-text');
      const resultSub = document.getElementById('result-sub');

      // Hide card
      card.classList.add('hidden');

      // Spawn hearts
      spawnFallingHearts(isMobile ? 32 : 80);

      // Keep spawning hearts in waves
      setTimeout(() => spawnFallingHearts(isMobile ? 16 : 40), 1000);
      setTimeout(() => spawnFallingHearts(isMobile ? 12 : 30), 2000);
      setTimeout(() => spawnFallingHearts(isMobile ? 16 : 40), 3000);
      setTimeout(() => spawnFallingHearts(isMobile ? 12 : 30), 4000);
      setTimeout(() => spawnFallingHearts(isMobile ? 16 : 40), 5000);
      setTimeout(() => spawnFallingHearts(isMobile ? 12 : 30), 6000);
      setTimeout(() => spawnFallingHearts(isMobile ? 16 : 40), 7000);
      setTimeout(() => spawnFallingHearts(isMobile ? 12 : 30), 8000);

      // Show result after short delay
      setTimeout(() => {
        if (type === 'yes') {
          resultEmoji.textContent = '💖';
          resultText.textContent = 'Я щасливий це чути 🥰';
          resultSub.textContent = 'З тобою цей день особливий 💕';
        } else {
          resultEmoji.textContent = '😊💕';
          resultText.textContent = 'Не соромся 🙂';
          resultSub.textContent = 'Ти все одно моя валентинка 💘';
        }

        result.classList.add('visible');

        // Sparkle burst at center
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2 - 40;
        createSparkles(cx, cy, isMobile ? 16 : 30);
        setTimeout(() => createSparkles(cx, cy, isMobile ? 10 : 20), 400);
      }, 600);
    }
  </script>
</body>
</html>
